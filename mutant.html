      <h1 class="misprint">Mutant <span>Realities</span></h1>

      <span class="caption">Two timelines. One very bad future.</span>
      <p>In <a href="title.html?id=days-of-future-past">Days of Future Past</a>, Wolverine is sent back to 1973 and changes history. The original timeline is overwritten, so the later films run on a new one.</p>
    </figcaption>
    <svg viewBox="0 0 1000 300" role="img" aria-label="Diagram: one timeline runs from First Class in 1962 to 1973, where Days of Future Past splits it. The original timeline (X-Men, X2, The Last Stand, The Wolverine) ends in a dark future and is overwritten; the new timeline continues with Apocalypse in 1983 and Dark Phoenix in 1992.">
      <g fill="none" stroke-linecap="round">

        <path class="strand" d="M300 150 C 380 150, 400 70, 480 70 H 900" stroke="var(--ink)" stroke-width="6" stroke-dasharray="14 10"/>
