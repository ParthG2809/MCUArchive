<body>

<main class="desk" id="main">
  <div class="wrap" id="room">
    <p class="crumbs"><a href="index.html">Archive</a> / <a id="crumbReality" href="mcu.html">Sacred Timeline</a> / <span id="crumb">File</span></p>

    <article class="folder" id="folder" data-tab="FILE">
      <div class="leaf-left">
        <figure class="photo">
          <span class="paperclip" aria-hidden="true"></span>
          <div id="posterSlot"></div>
          <figcaption>Exhibit A</figcaption>
        </figure>
        <div class="stamps" id="stamps"></div>
        <button class="stamp-pad" type="button" id="stampPad" aria-pressed="false">Stamp as watched</button>
      </div>
      <span class="stamp big-stamp" aria-hidden="true">Watched</span>

      <div class="leaf-right">
        <div class="sheet">
          <div class="sheet-tabs" role="tablist" aria-label="File sections">
            <button role="tab" type="button" id="tab-file" data-tab="file" aria-selected="true" aria-controls="panel">File</button>
            <button role="tab" type="button" id="tab-links" data-tab="links" aria-selected="false" aria-controls="panel">Connections</button>
            <button role="tab" type="button" id="tab-order" data-tab="order" aria-selected="false" aria-controls="panel">Watch order</button>
          </div>
          <div class="sheet-head"><span id="fileNo">AGENCY FILE</span><span id="earth"></span></div>
          <h1 id="title"></h1>
          <div id="panel" role="tabpanel" aria-labelledby="tab-file"></div>
        </div>
      </div>
    </article>

    <section class="cast" id="cast" aria-labelledby="cast-title" hidden></section>

    <nav class="pager" id="pager" aria-label="Neighbouring files"></nav>
  </div>
</main>
