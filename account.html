<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Sign in to The Marvel Archive to keep your watch history on every device.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<main class="wrap" id="main">
  <section class="acct">
    <div class="acct-intro">
      <span class="caption">Membership desk</span>
      <h1 class="misprint">Your <span>Account</span></h1>
      <p>Sign in to keep your watch history on every device. Without an account, the titles you mark as watched are saved in this browser only.</p>

    <div class="member-card" id="card" aria-live="polite">
      <div class="card-band"><span>Archive membership</span><span aria-hidden="true">No. 616</span></div>
      <div class="card-body" id="cardBody"><p class="card-note">Checking the records…</p></div>
    </div>
  </section>
</main>
