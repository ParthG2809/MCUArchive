<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case File: The Marvel Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bungee&family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/archive.css">
<style>
/* the dossier room: a dark desk under a lamp */
.desk {
  background: radial-gradient(ellipse 70% 60% at 50% 0%, #5A4430, #24190F 62%, #140E09);
  padding: 34px 0 90px; border-bottom: var(--rule);
}
.crumbs { font: 400 14px var(--f-type); color: var(--paper-3); margin-bottom: 52px; }
.crumbs a { color: var(--paper); }

.folder {
  position: relative; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr);
  background: var(--manila); border: var(--rule); box-shadow: 0 40px 70px -20px rgba(0,0,0,.7), 10px 10px 0 #0B0805;
}
.folder::before { /* folder tab */
  content: attr(data-tab); position: absolute; top: -40px; left: -3px; height: 40px; padding: 10px 22px 0;
  background: var(--manila); border: var(--rule); border-bottom: 0; font: 400 14px var(--f-sign); letter-spacing: .06em;
}
.folder::after { /* the crease */
  content: ""; position: absolute; top: 0; bottom: 0; left: 41.8%; width: 14px;
  background: linear-gradient(90deg, transparent, rgba(80,55,20,.35) 45%, rgba(255,240,200,.35) 55%, transparent);
}

/* left leaf */
.leaf-left { padding: 40px 36px 36px; display: flex; flex-direction: column; gap: 26px; align-items: flex-start; }
.photo { position: relative; background: #fff; padding: 10px 10px 34px; transform: rotate(-2.5deg); box-shadow: 0 10px 18px -6px rgba(0,0,0,.45); width: min(100%, 300px); }
.photo .poster { aspect-ratio: 2 / 3; }
.photo figcaption { position: absolute; left: 12px; bottom: 9px; font: 400 13px var(--f-type); }
.paperclip { position: absolute; top: -22px; right: 40px; width: 22px; height: 64px; border: 4px solid #9A9A9A; border-radius: 12px; z-index: 3; }
.paperclip::after { content: ""; position: absolute; inset: 8px 3px 14px; border: 3px solid #9A9A9A; border-radius: 8px; }
.stamps { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.stamp.stone { color: var(--stone); border-color: var(--stone); transform: rotate(4deg); }
.stamp.blue { color: var(--blue); border-color: var(--blue); transform: rotate(-3deg); }
.stamp-pad {
  font: 400 15px var(--f-sign); letter-spacing: .04em; background: var(--ink); color: var(--paper); border: 0; padding: 14px 18px;
  box-shadow: 4px 4px 0 var(--red); cursor: pointer;
}
.stamp-pad[aria-pressed="true"] { background: var(--red); box-shadow: 4px 4px 0 var(--ink); }
.big-stamp { position: absolute; left: 60px; top: 46%; font-size: 34px; padding: 6px 18px; mix-blend-mode: normal; background: rgba(251,247,236,.88); transform: rotate(-16deg) scale(1.6); opacity: 0; z-index: 4; pointer-events: none; }
.folder.is-watched .big-stamp { opacity: .85; transform: rotate(-16deg) scale(1); transition: transform .3s cubic-bezier(.3,1.6,.5,1), opacity .2s; }

/* right leaf: typed sheet */
.leaf-right { padding: 28px 30px 30px 20px; }
.sheet {
  position: relative; background: var(--sheet); border: 1px solid #BDAE8E; box-shadow: 0 2px 0 #CDBF9F, 0 4px 0 #BDAE8E; transform: rotate(.5deg);
  padding: 0 34px 34px;
}
.sheet-tabs { display: flex; gap: 4px; margin: 0 0 0 -8px; transform: translateY(-100%); position: absolute; top: 0; left: 30px; }
.sheet-tabs button {
  font: 400 13px var(--f-sign); letter-spacing: .04em; background: var(--paper-2); color: var(--ink); border: 1px solid #BDAE8E; border-bottom: 0;
  padding: 8px 14px; cursor: pointer;
}
.sheet-tabs button[aria-selected="true"] { background: var(--sheet); padding-top: 12px; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; padding: 26px 0 12px; border-bottom: 2px solid var(--ink); font: 400 13px var(--f-type); letter-spacing: .08em; }
.sheet h1 { font: 400 clamp(38px, 4.6vw, 62px)/0.95 var(--f-head); margin: 22px 0 22px; }
.fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; }
.field { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid #CDBF9F; padding: 8px 0; font: 400 15px var(--f-type); }
.field span { color: #7A6E5C; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }
.summary-label { margin: 26px 0 8px; font: 400 12px var(--f-type); letter-spacing: .1em; text-transform: uppercase; color: #7A6E5C; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.summary { font: 400 18px/1.7 var(--f-type); }
.redact { background: var(--ink); color: transparent; cursor: pointer; border: 0; font: inherit; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background .3s, color .3s; }
.redact.open { background: rgba(245,197,24,.55); color: var(--ink); cursor: text; }
.note {
  position: relative; margin: 26px 0 0 auto; width: fit-content; max-width: 34ch; font: 400 17px/1.35 var(--f-type);
  color: var(--red); transform: rotate(-2deg); padding-left: 34px;
}
.note::before { content: "↳"; position: absolute; left: 0; top: -4px; font-size: 26px; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; margin-top: 18px; }
.link-card { text-decoration: none; display: grid; gap: 8px; }
.link-card .poster { border: 2px solid var(--ink); box-shadow: var(--hard-sm); transition: transform .2s; }
.link-card:hover .poster { transform: translate(-2px, -2px) rotate(-1deg); }
.link-card b { font: 400 16px/1.1 var(--f-head); }
.link-card small { font: 400 12px var(--f-type); color: #7A6E5C; }
.order-list { display: grid; gap: 12px; margin-top: 18px; }
.order-list a { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; text-decoration: none; padding: 10px 0; border-bottom: 1px solid #CDBF9F; font: 400 15px var(--f-type); }
.order-list a b { font: 400 20px var(--f-head); }
.order-list span { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #7A6E5C; }

/* next / previous folders along the desk */
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 50px; }
.pager a { flex: 0 1 340px; background: var(--paper-3); border: var(--rule); padding: 12px 18px; text-decoration: none; font: 400 13px var(--f-type); box-shadow: 6px 6px 0 #0B0805; transition: transform .2s; }
.pager a:hover { transform: translateY(-4px); }
.pager a b { display: block; font: 400 20px/1.1 var(--f-head); margin-top: 4px; }
.pager a.next { text-align: right; margin-left: auto; }

@media (max-width: 900px) {
  .folder { grid-template-columns: 1fr; }
  .folder::after { display: none; }
  .leaf-left { flex-direction: row; flex-wrap: wrap; padding: 34px 22px 10px; }
  .photo { width: 180px; }
  .leaf-right { padding: 50px 12px 14px; }
  .sheet { padding: 0 18px 24px; transform: none; }
  .fields { grid-template-columns: 1fr; }
  .big-stamp { left: 20px; top: 120px; }
  .pager { flex-direction: column; }
}
</style>
</head>
<body data-page="title">

<div class="desk">
  <div class="wrap">
    <p class="crumbs"><a href="index.html">Archive</a> / <a href="mcu.html">Sacred Timeline</a> / <span id="crumb">File</span></p>

    <article class="folder" id="folder" data-tab="FILE">
      <div class="leaf-left">
        <figure class="photo">
          <span class="paperclip" aria-hidden="true"></span>
          <div class="poster" data-poster><img alt="" id="posterImg"><div class="fallback" id="posterFallback"></div></div>
          <figcaption>Exhibit A</figcaption>
        </figure>
        <div class="stamps" id="stamps"></div>
        <button class="stamp-pad" type="button" id="stampPad" aria-pressed="false">Stamp as watched</button>
      </div>
      <span class="stamp big-stamp" aria-hidden="true">Watched</span>

      <div class="leaf-right">
        <div class="sheet">
          <div class="sheet-tabs" role="tablist">
            <button role="tab" type="button" data-tab="file" aria-selected="true">File</button>
            <button role="tab" type="button" data-tab="links" aria-selected="false">Connections</button>
            <button role="tab" type="button" data-tab="order" aria-selected="false">Watch order</button>
          </div>
          <div class="sheet-head"><span id="fileNo">AGENCY FILE</span><span>REALITY: EARTH-616</span></div>
          <h1 id="title"></h1>
          <div id="panel" role="tabpanel"></div>
        </div>
      </div>
    </article>

    <nav class="pager" id="pager" aria-label="Neighbouring files"></nav>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/data.js"></script>
<script src="js/archive.js"></script>
<script>
renderChrome("title");

const params = new URLSearchParams(location.search);
const t = byId(params.get("id")) || byId("endgame");
const d = DOSSIER[t.id];
const s = PHASE_STONES[t.phase];
const folder = document.getElementById("folder");
document.title = `${t.title}: Case File: The Marvel Archive`;
folder.style.setProperty("--stone", stoneVar(t.phase));
folder.dataset.tab = `FILE ${fileNo(t)} · ${t.type.toUpperCase()}`;
document.getElementById("crumb").textContent = `File ${fileNo(t)}`;
document.getElementById("fileNo").textContent = `AGENCY FILE No. ${fileNo(t)}`;
document.getElementById("title").textContent = t.title;
document.getElementById("posterImg").dataset.wiki = t.wiki;
document.getElementById("posterImg").alt = `${t.title} poster`;
document.getElementById("posterFallback").textContent = t.title;
document.getElementById("stamps").innerHTML = `
  <span class="stamp stone">Phase ${PHASE_WORDS[t.phase]}</span>
  <span class="stamp blue">${s.stone} Stone</span>
  ${t.nexus ? '<span class="stamp">Nexus event</span>' : ""}
  ${t.upcoming ? '<span class="stamp">Pending release</span>' : '<span class="stamp blue">Canon · Confirmed</span>'}`;
hydratePosters();

/* tab panels */
const sorted = (key) => [...MCU_SAMPLE].sort((a, b) => a[key] - b[key]);
function neighbours(key) {
  const list = sorted(key), i = list.indexOf(t);
  return [list[i - 1], list[i + 1]];
}
const panels = {
  file: () => `
    <div class="fields">
      <div class="field"><span>Released</span>${t.year}</div>
      <div class="field"><span>Set in</span>${t.setIn}</div>
      <div class="field"><span>Format</span>${t.type}</div>
      <div class="field"><span>Runtime</span>${t.runtime}</div>
      <div class="field" style="grid-column:1/-1"><span>Directed by</span>${t.director}</div>
    </div>
    <p class="summary-label"><span>Summary</span><span>Spoilers redacted. Click a bar to declassify.</span></p>
    <p class="summary">${d.summary.replace(/\[\[(.+?)\]\]/g, '<button type="button" class="redact" aria-label="Reveal spoiler">$1</button>')}</p>
    <p class="note">Agent's note: ${d.note}</p>`,
  links: () => `
    <p class="summary-label"><span>Linked files</span><span>${d.links.length} connections</span></p>
    <div class="links">${d.links.map((id) => {
      const l = byId(id);
      return `<a class="link-card" href="title.html?id=${l.id}"><div class="poster" data-poster><img alt="" data-wiki="${l.wiki}"><div class="fallback">${l.title}</div></div><small>File ${fileNo(l)} · ${l.year}</small><b>${l.title}</b></a>`;
    }).join("")}</div>`,
  order: () => {
    const [rp, rn] = neighbours("release"), [cp, cn] = neighbours("chrono");
    const row = (label, x) => x ? `<a href="title.html?id=${x.id}"><span>${label}</span><b>${x.title}</b></a>` : "";
    return `<p class="summary-label"><span>Before &amp; after this file</span></p>
      <div class="order-list">${row("Release · before", rp)}${row("Release · after", rn)}${row("Story · before", cp)}${row("Story · after", cn)}</div>`;
  },
};
const panel = document.getElementById("panel");
function showTab(name) {
  document.querySelectorAll(".sheet-tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  panel.innerHTML = panels[name]();
  hydratePosters(panel);
  if (!prefersReducedMotion) gsap.from(panel.children, { opacity: 0, y: 10, duration: 0.35, stagger: 0.05 });
}
document.querySelector(".sheet-tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (b) showTab(b.dataset.tab);
});
panel.addEventListener("click", (e) => {
  const r = e.target.closest(".redact"); if (r) r.classList.add("open");
});
showTab("file");

/* watched stamp */
const pad = document.getElementById("stampPad");
function syncWatched() {
  const on = watched.has(t.id);
  folder.classList.toggle("is-watched", on);
  pad.setAttribute("aria-pressed", on);
  pad.textContent = on ? "Watched ✓  (undo)" : "Stamp as watched";
}
pad.addEventListener("click", () => { toggleWatched(t.id); syncWatched(); });
syncWatched();

/* previous / next file in release order */
const [prev, next] = neighbours("release");
document.getElementById("pager").innerHTML =
  (prev ? `<a href="title.html?id=${prev.id}">← Previous file<b>${prev.title}</b></a>` : "") +
  (next ? `<a class="next" href="title.html?id=${next.id}">Next file →<b>${next.title}</b></a>` : "");

if (!prefersReducedMotion) {
  gsap.from(".folder", { y: 50, rotation: -1.5, opacity: 0, duration: 0.8, ease: "power3.out", clearProps: "opacity,transform" });
  gsap.from(".photo", { x: -30, rotation: -12, duration: 0.9, ease: "back.out(1.6)", delay: 0.2 });
}
</script>
</body>
</html>
