      <span class="caption">Does it count?</span>
      <p>Every legacy file carries a canon stamp, so you know where it stands with the Sacred Timeline.</p>
    </figcaption>
    <dl class="canon-key">
      <div><dt><span class="tag tag-canon tag-recognised">Added to MCU timeline</span></dt>
        <dd>Disney+ added the Netflix Defenders shows to its official MCU timeline in January 2024. Daredevil's story continues in Daredevil: Born Again.</dd></div>
      <div><dt><span class="tag tag-canon tag-disputed">Canon disputed</span></dt>
        <dd>Made to tie in with the films, like Agents of S.H.I.E.L.D. and Agent Carter, but never confirmed by Marvel Studios.</dd></div>
      <div><dt><span class="tag tag-canon tag-separate">Own continuity</span></dt>
        <dd>Stands on its own, like Blade, the 2000s films and the cartoons.</dd></div>
    </dl>
